<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async JavaScript - Mercy Muiruri</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; color: #333; }
    .hidden { display: none; }
    .user-card { border: 1px solid #ddd; padding: 12px; margin: 10px 0; border-radius: 6px; background-color: #f9f9f9; }
    .error { color: #d9534f; font-weight: bold; }
    section { border: 1px solid #ccc; padding: 15px; margin-bottom: 25px; border-radius: 8px; }
    form { max-width: 400px; }
    input, select, textarea, button { padding: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>User Dashboard & Posts</h1>
  <p><strong>Student:</strong> Mercy Muiruri | <strong>Location:</strong> Nairobi, Kenya</p>

  <!-- User Directory Section -->
  <section>
    <h2>User Directory</h2>
    <div id="app">
      <div id="loading">Loading...</div>
      <div id="error" class="hidden"></div>
      <div id="users-container"></div>
    </div>
  </section>

  <!-- Form Section -->
  <section>
    <h2>Create a New Post</h2>
    <form id="post-form">
      <input type="text" id="post-title" placeholder="Post Title" required />
      <textarea id="post-body" placeholder="Post Content" rows="3" required></textarea>
      <button type="submit">Submit Post</button>
    </form>
    <div id="post-result" style="margin-top: 10px;"></div>
  </section>

  <!-- Search & Filter Section -->
  <section>
    <h2>Search & Filter Users</h2>
    <div id="search-controls">
      <input type="text" id="search-input" placeholder="Search by name or email..." />
      <select id="sort-select">
        <option value="asc">Sort A-Z</option>
        <option value="desc">Sort Z-A</option>
      </select>
      <select id="city-filter">
        <option value="all">All Cities</option>
      </select>
    </div>
    <div id="filtered-users-container"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
